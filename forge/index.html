<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge | Artisan Cookware</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              forge: {
                black: '#1A1A1A',
                charcoal: '#2B2B2B',
                brass: '#B8860B',
                copper: '#B87333',
                white: '#F5E6CC',
                emerald: '#0A3E39',
                pencil: '#404040'
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Work Sans"', 'sans-serif'],
              display: ['"Bebas Neue"', 'sans-serif'],
            },
            cursor: {
              'fancy': 'url(https://img.icons8.com/ios-filled/50/B8860B/hammer.png), auto',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #1A1A1A;
        color: #F5E6CC;
        overflow-x: hidden;
      }
      /* Lenis recommended styles */
      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1A1A1A; 
      }
      ::-webkit-scrollbar-thumb {
        background: #B87333; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B8860B; 
      }
    </style>
